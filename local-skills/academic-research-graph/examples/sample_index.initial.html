 "paper", "title": "An Image is Worth 16x16 Words", "authors": ["Alexey Dosovitskiy et al."], "year": 2020, "date": "2020-10-22", "venue": "ICLR", "status": "published", "summary": "将图像切分为 patch 并视为 token，采用接近标准的 Transformer 编码器进行图像分类；结果强调大规模预训练的重要性。", "role": "种子论文", "cluster": "Main Lineage", "relevance": 1.0, "quality": 0.92, "is_seed": true, "latest_frontier": false, "identifiers": {"arXiv": "2010.11929"}, "urls": {"arXiv": "https://arxiv.org/abs/2010.11929"}, "claims": [{"text": "A pure Transformer can perform competitively on image classification when pretrained at sufficient scale."}], "evidence_ids": ["ev2"], "notes": [], "roles": {"zh-CN": "种子论文", "en": "seed"}, "summaries": {"zh-CN": "将图像切分为 patch 并视为 token，采用接近标准的 Transformer 编码器进行图像分类；结果强调大规模预训练的重要性。", "en": "Treats image patches as tokens and applies a largely standard Transformer encoder to image classification, showing strong performance with large-scale pretraining."}, "publication": {"status": "published", "type": "conference_paper", "peer_reviewed": true, "primary_venue": {"name": "ICLR", "short_name": "ICLR", "type": "conference", "tier": "top", "tier_label": {"zh-CN": "顶会", "en": "Top-tier conference"}, "tier_basis": "示例领域配置；实际运行时必须记录采用的学科榜单、机构规则或用户指定标准。", "tier_as_of": "2026-08-05", "url": null}, "versions": [{"kind": "preprint", "label": "arXiv preprint", "date": "2020-10-22", "status": "public", "venue": "arXiv", "url": "https://arxiv.org/abs/2010.11929", "identifier": "arXiv:2010.11929", "peer_reviewed": false, "is_primary": false}, {"kind": "conference", "label": "Conference version", "date": "2020", "status": "published", "venue": "ICLR", "url": null, "identifier": null, "peer_reviewed": true, "is_primary": true}], "notes": ["示例中的 venue tier 仅用于演示 UI；实际运行必须按明确规则核验。"]}, "reader_summary": {"audience": "field_familiar_unread", "zh-CN": {"background": "图像分类长期由卷积神经网络主导，因为卷积天然利用局部邻域和空间平移结构。与此同时，Transformer 已在语言任务中证明了大规模预训练与全局 token 交互的能力，但图像并不是现成的 token 序列。", "problem": "论文要回答：能否尽量少地加入视觉专用结构，直接把标准 Transformer 用于图像分类；如果可以，它需要怎样的数据规模和训练条件。", "approach": "ViT 把一张图像切成固定大小的 patch，将每个 patch 展平并映射成一个向量，把这些向量当作类似词 token 的序列。模型在序列前加入用于汇总整幅图像的分类 token，再用标准 Transformer 编码器处理所有 patch。最后用分类 token 的表示进行预测。", "key_findings": ["在中等规模数据上直接训练时，ViT 未必优于强卷积基线；当先在很大规模数据集上预训练、再迁移到目标任务时，它能取得很强的图像分类结果。", "结果说明架构中的视觉归纳偏置可以减少，但减少后通常需要更多数据来学习原本由卷积直接提供的局部结构。"], "why_it_matters": "这篇论文建立了视觉 Transformer 的主干范式：图像 patch token 化后可以直接使用 Transformer。后续大量工作围绕数据效率、局部性、层次结构和计算成本改造这一范式。", "limitations": ["论文最突出的优势依赖超大规模预训练数据和计算资源，普通研究者难以完全复现该条件。", "固定 patch 和全局注意力对密集预测、多尺度目标以及高分辨率输入并非天然高效。"], "concepts": [{"term": "图像 patch", "explanation": "把图像按固定网格切出的矩形小块，每个小块被编码为一个 token。"}, {"term": "归纳偏置（inductive bias）", "explanation": "模型结构预先假定的数据规律；卷积例如预设局部连接和平移共享，而 ViT 更少依赖这些先验。"}]}}, "featured_figure": {"kind": "method_overview", "display_kind": "analyst_reconstruction", "label": "方法总览（示意重绘）", "captions": {"zh-CN": "ViT 将输入图像切分为固定大小的图像块，把每个图像块映射为一个 token，并把这些 token 连同类别 token 一起送入 Transformer 编码器完成分类。"}, "alt_texts": {"zh-CN": "流程图从左到右展示：图像被切成网格图像块，图像块转换为带位置编码的 token 序列，序列经过多层 Transformer 编码器，最后由类别 token 输出类别预测。"}, "reader_notes": {"zh-CN": "重点看“图像块变成 token 序列”这一步。ViT 的核心变化不是发明新的注意力结构，而是把原本用于序列的 Transformer 直接应用到图像块序列。"}, "selection_reasons": {"zh-CN": "这张图能够在不阅读公式和实现细节的情况下，直观解释 ViT 相对卷积网络最关键的输入表示变化。"}, "source": {"citation": "Academic Research Graph Skill 示例图；依据 Dosovitskiy et al. (2020) 的方法流程自行重绘。", "paper_version": "arXiv:2010.11929", "figure_number": null, "page": null, "url": "https://arxiv.org/abs/2010.11929", "license": "示例原创 SVG", "rights_status": "analyst_original", "retrieved_at": "2026-08-05", "notes": "非论文原图，不复刻论文版式。"}, "asset": {"path": "assets/figures/paper-vit/vit-overview-reconstruction.svg", "mime_type": "image/svg+xml", "sha256": "786bee64f6faec25921b04e0c60a534eb97d6c0ceab33b75f1813ca354a833fa", "width": 960, "height": 420, "cropped": false, "crop_notes": null}, "evidence_ids": ["ev:vit-method-overview"], "_resolved_src": "data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5 难以判断视觉 Transformer 本身是否必须依赖极大数据，还是训练流程尚未被充分优化。", "problem": "DeiT 试图在仅使用公开 ImageNet-1K 规模数据的条件下，让视觉 Transformer 获得有竞争力的分类性能，并减少对超大规模预训练的依赖。", "approach": "论文首先系统调整数据增强、正则化、优化器和训练日程，使 ViT 在较小数据上训练得更稳定。随后加入蒸馏 token：它像分类 token 一样参与注意力，但学习模仿一个已训练教师模型的输出。这样学生 Transformer 不只从真实标签学习，也从教师提供的类别偏好中获得额外监督。", "key_findings": ["在 ImageNet-1K 上从头训练时，经过改进的训练配方显著缩小了 ViT 与强卷积网络之间的差距。", "使用卷积教师进行蒸馏后，DeiT 在不使用额外私有预训练数据的情况下进一步提升分类表现。"], "why_it_matters": "DeiT 表明，ViT 的数据需求并不完全是架构不可避免的属性，训练策略和知识蒸馏可以显著改变数据效率。这开辟了数据高效视觉 Transformer 分支。", "limitations": ["性能依赖精心调节的训练配方，换数据集或任务时不一定原样成立。", "蒸馏版本需要额外训练教师模型，而且教师的归纳偏置会影响学生学到的行为。"], "concepts": [{"term": "知识蒸馏（knowledge distillation）", "explanation": "让学生模型在真实标签之外模仿教师模型的预测，从教师的软信息中学习。"}, {"term": "蒸馏 token", "explanation": "DeiT 中专门接收教师监督的可学习 token，与普通分类 token 一起经过 Transformer。"}]}}}, {"id": "paper:swin", "type": "paper", "title": "Swin Transformer: Hierarchical Vision Transformer using Shifted Windows", "authors": ["Ze Liu et al."], "year": 2021, "date": "2021-03-25", "venue": "ICCV", "status": "published", "summary": "引入局部移位窗口注意力与层次化表示，使 Transformer 主干更适合密集视觉任务。", "role": "架构分支", "cluster": "Architecture", "relevance": 0.88, "quality": 0.91, "is_seed": false, "latest_frontier": false, "identifiers": {"arXiv": "2103.14030"}, "urls": {"arXiv": "https://arxiv.org/abs/2103.14030"}, "claims": [], "evidence_ids": ["ev4"], "notes": [], "roles": {"zh-CN": "架构分支", "en": "architectural branch"}, "summaries": {"zh-CN": "引入局部移位窗口注意力与层次化表示，使 Transformer 主干更适合密集视觉任务。", "en": "Introduces local shifted-window attention and a hierarchical representation, making Transformer backbones more suitable for dense vision tasks."}, "publication": {"status": "published", "type": "conference_paper", "peer_reviewed": true, "primary_venue": {"name": "ICCV", "short_name": "ICCV", "type": "conference", "tier": "top", "tier_label": {"zh-CN": "顶会", "en": "Top-tier conference"}, "tier_basis": "示例领域配置；实际运行时必须记录采用的学科榜单、机构规则或用户指定标准。", "tier_as_of": "2026-08-05", "url": null}, "ver function makeRequest(n){return{operation:'expand',base_graph:'graph.json',base_graph_id:DATA.meta?.graph_id||'',base_revision:Number(DATA.meta?.revision||1),start_node_id:n.id,start_node_title:n.title,focus:document.getElementById('expFocus').value,direction:document.getElementById('expDirection').value,mode:'standard',max_depth:Number(document.getElementById('expDepth').value||2),candidate_budget:Number(document.getElementById('expCandidates').value||120),analysis_budget:Number(document.getElementById('expAnalysis').value||35),output_language:LANG,summary_policy:DATA.meta?.summary_policy||{audience:'field_familiar_unread',exposition_depth:'explanatory',explain_background:true,define_paper_specific_terms:true,expand_acronyms_on_first_use:true,name_comparison_baselines:true,require_limitations_and_scope:true},figure_policy:DATA.meta?.figure_policy||{enabled:true,selection_mode:'selective',max_per_paper:1,require_source_attribution:true,require_alt_text:true,embed_local_assets:true,allow_remote_images:false,max_embedded_bytes:2500000},allow_main_path_revision:true,created_at:new Date().toISOString()}}
async function exportRequest(n,copyOnly){const req=makeRequest(n),text=JSON.stringify(req,null,2);if(copyOnly){try{await navigator.clipboard.writeText(text);toast(UI.copied)}catch{downloadText(text,`expansion_request.${safe(n.id)}.json`);toast(UI.downloaded)}}else{downloadText(text,`expansion_request.${safe(n.id)}.json`);toast(UI.downloaded)}}function safe(s){return String(s).replace(/[^a-zA-Z0-9._-]+/g,'-')}function downloadText(text,name){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1800)}
function showEdge(e){const a=DATA.nodes.find(n=>n.id===e.source),b=DATA.nodes.find(n=>n.id===e.target);detail.innerHTML=`<div class="eyebrow">${UI.paper_relation}</div><h2>${esc(a?titleOf(a):e.source)} → ${esc(b?titleOf(b):e.target)}</h2><div>${(e.relationship||[]).map(r=>`<span class="pill ${e.conflict?'danger':''}">${esc(r)}</span>`).join('')}${changedLatest(e)?`<span class="pill increment">${UI.latest_increment}</span>`:''}</div><p>${esc(explanationOf(e))}</p><div class="meta">${UI.evidence_level}: ${esc(e.evidence_level||UI.unlabeled)}<br>${UI.confidence}: ${Number(e.confidence||0).toFixed(2)}<br>${UI.citation_direction}: ${esc(e.citation_direction||UI.unlabeled)}<br>${e.main_path?UI.main_path+'<br>':''}${e.conflict?`${UI.conflict_type}: ${esc(e.conflict_type||UI.unclassified)}<br>`:''}${UI.evidence_ids}: ${esc((e.evidence_ids||[]).join(', ')||UI.none)}${revisionMeta(e)}</div>`}
function fit(){const n=state.nodes;if(!n.length)return;const xs=n.map(x=>x.x),ys=n.map(x=>x.y),minx=Math.min(...xs)-80,maxx=Math.max(...xs)+180,miny=Math.min(...ys)-80,maxy=Math.max(...ys)+80;state.scale=Math.min(svg.clientWidth/(maxx-minx),svg.clientHeight/(maxy-miny),1.5);state.tx=(svg.clientWidth-(minx+maxx)*state.scale)/2;state.ty=(svg.clientHeight-(miny+maxy)*state.scale)/2;applyTransform()}
svg.addEventListener('wheel',e=>{e.preventDefault();state.scale=Math.max(.2,Math.min(4,state.scale*(e.deltaY<0?1.12:.89)));applyTransform()},{passive:false});svg.addEventListener('pointerdown',e=>{if(e.target===svg){state.pan={x:e.clientX,y:e.clientY,tx:state.tx,ty:state.ty};svg.setPointerCapture(e.pointerId)}});svg.addEventListener('pointermove',e=>{if(state.pan){state.tx=state.pan.tx+e.clientX-state.pan.x;state.ty=state.pan.ty+e.clientY-state.pan.y;applyTransform()}});svg.addEventListener('pointerup',()=>state.pan=null);
['search','edgeType','cluster','relevance','mainOnly','conflictOnly','latestOnly'].forEach(id=>document.getElementById(id)?.addEventListener('input',()=>{document.getElementById('relValue').textContent=(+document.getElementById('relevance').value).toFixed(2);render()}));document.getElementById('fit').onclick=fit;document.getElementById('reset').onclick=()=>{state.scale=1;state.tx=state.ty=0;initPositions();render()};window.addEventListener('resize',fit);populate();initPositions();render();setTimeout(fit,450);
</script></body></html>
