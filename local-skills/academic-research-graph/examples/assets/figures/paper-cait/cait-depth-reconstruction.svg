<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">CaiT class-attention overview reconstruction</title><desc id="desc">Patch tokens pass through deep self-attention blocks first, then a class token is introduced into class-attention blocks to aggregate information for classification.</desc>
<rect width="960" height="360" rx="24" fill="#f3f6fb"/><g font-family="Arial, sans-serif"><text x="45" y="48" font-size="24" font-weight="700" fill="#1d2c43">CaiT：先深度处理图像块，再让类别 token 汇总</text><g transform="translate(45 100)"><g fill="#7698ca"><rect width="110" height="42" rx="8"/><rect y="54" width="110" height="42" rx="8"/><rect y="108" width="110" height="42" rx="8"/></g><text x="55" y="182" text-anchor="middle" font-size="17" fill="#253a57">Patch tokens</text></g><path d="M175 175H265" stroke="#536d95" stroke-width="4" marker-end="url(#m)"/><defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#536d95"/></marker></defs><g transform="translate(285 83)"><rect width="250" height="185" rx="14" fill="#dce7f6" stroke="#6480a9" stroke-width="2"/><text x="125" y="38" text-anchor="middle" font-size="19" font-weight="700" fill="#233b5d">深层 Self-Attention</text><g fill="#7899c8"><rect x="35" y="62" width="180" height="28" rx="6"/><rect x="35" y="102" width="180" height="28" rx="6"/><rect x="35" y="142" width="180" height="28" rx="6"/></g></g><path d="M555 175H645" stroke="#536d95" stroke-width="4" marker-end="url(#m)"/><g transform="translate(665 83)"><rect width="250" height="185" rx="14" fill="#fff1d8" stroke="#b98634" stroke-width="2"/><circle cx="45" cy="55" r="24" fill="#efb15b"/><text x="45" y="61" text-anchor="middle" font-size="14" font-weight="700">CLS</text><text x="145" y="43" text-anchor="middle" font-size="19" font-weight="700" fill="#5c421d">Class-Attention</text><text x="145" y="78" text-anchor="middle" font-size="15" fill="#6c5430">只更新类别 token</text><rect x="45" y="105" width="160" height="42" rx="8" fill="#e5a647"/><text x="125" y="132" text-anchor="middle" fill="#fff" font-size="16">汇总并分类</text></g><text x="45" y="326" font-size="14" fill="#62718a">分析者示意重绘，仅用于演示增量节点主图资产的合并与展示。</text></g></svg>
