name: zh-core
canvas: {width_in: 6.7, height_in: 4.4, dpi: 300, background: "#FFFFFF"}
fonts:
  cjk_family: SimSun
  latin_family: Times New Roman
  fallback: [Noto Serif CJK SC, Microsoft YaHei, DejaVu Sans]
  sizes: {title: 12, axis_label: 10, tick: 8, legend: 8, annotation: 8, table: 7}
palette:
  categorical: ["#0072B2", "#D55E00", "#009E73", "#CC79A7", "#E69F00", "#56B4E9"]
  sequential: viridis
  diverging: RdBu_r
axis: {spine_width: 0.8, grid: y-major-light, tick_direction: out}
legend: {frame: false, location: best}
table: {header: true, font_size: 7}
