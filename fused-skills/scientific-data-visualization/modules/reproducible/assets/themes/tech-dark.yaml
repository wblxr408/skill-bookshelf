name: tech-dark
canvas: {width_in: 7.2, height_in: 4.5, dpi: 300, background: "#0B1220", panel_background: "#101B2D", foreground: "#E6F2FF"}
fonts:
  cjk_family: Microsoft YaHei
  latin_family: Arial
  fallback: [Noto Sans CJK SC, DejaVu Sans]
  sizes: {title: 13, axis_label: 10, tick: 8, legend: 8, annotation: 8, table: 7}
palette:
  categorical: ["#38BDF8", "#A78BFA", "#34D399", "#FBBF24", "#FB7185", "#22D3EE"]
  sequential: plasma
  diverging: coolwarm
  reference: "#CBD5E1"
  alert: "#FB7185"
axis: {spine_width: 0.9, spine_color: "#5B708C", grid: both, grid_color: "#29425E", grid_alpha: 0.62, grid_width: 0.55, tick_direction: out, tick_color: "#BED5EE", label_color: "#E6F2FF", title_color: "#F8FAFC"}
legend: {frame: false, location: best}
marks: {marker: o, marker_size: 4, marker_alpha: 0.88, scatter_size: 28, line_width: 1.8, fit_line_width: 1.4}
annotation: {background: "#17263C", edge_color: "#4F6C8B", text_color: "#E6F2FF", alpha: 0.96}
table: {header: true, font_size: 7, header_background: "#1E3A5F", cell_background: "#101B2D", edge_color: "#3C5878", edge_width: 0.5, text_color: "#E6F2FF"}
