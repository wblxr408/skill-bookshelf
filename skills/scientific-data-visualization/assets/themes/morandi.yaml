name: morandi
canvas: {width_in: 6.5, height_in: 4.2, dpi: 300, background: "#F8F5F0", panel_background: "#FDFBF7", foreground: "#45413C"}
fonts:
  cjk_family: Microsoft YaHei
  latin_family: Arial
  fallback: [Noto Sans CJK SC, DejaVu Sans]
  sizes: {title: 12, axis_label: 10, tick: 8, legend: 8, annotation: 8, table: 7}
palette:
  categorical: ["#7F9C96", "#C48B7A", "#A6A37B", "#9B8FA6", "#C7A96B", "#6F8798"]
  sequential: cividis
  diverging: PuOr
  reference: "#625C55"
  alert: "#A55E52"
axis: {spine_width: 0.8, spine_color: "#756E65", grid: y-major-light, grid_color: "#DED7CE", grid_alpha: 0.85, grid_width: 0.5, tick_direction: out, tick_color: "#625C55", label_color: "#45413C", title_color: "#36322F"}
legend: {frame: false, location: best}
marks: {marker: o, marker_size: 3.5, marker_alpha: 0.82, scatter_size: 24, line_width: 1.5, fit_line_width: 1.2}
annotation: {background: "#FDFBF7", edge_color: "#B9B0A5", text_color: "#45413C", alpha: 0.94}
table: {header: true, font_size: 7, header_background: "#EAE3D8", cell_background: "#FDFBF7", edge_color: "#C9C0B5", edge_width: 0.5, text_color: "#45413C"}
